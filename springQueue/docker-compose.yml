services:
  spring-app:
    build: .
    container_name: spring-kafka-container
    ports:
      - "8080:8080"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    networks:
      - kafka-infra-net

networks:
  kafka-infra-net:
    external: true
    name: kafka_back-net