# =============================
# APPLICATION
# =============================
spring.application.name=springQueue

# =============================
# KAFKA - PRODUCER
# =============================
spring.kafka.bootstrap-servers=localhost:9092

# Serialização
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# Durabilidade (FINTECH: acks=all exige confirmação de todas as réplicas)
spring.kafka.producer.acks=all

# Prevenção de duplicatas (FINTECH: idempotência no broker)
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# Retry em caso de falha transitória
spring.kafka.producer.retries=3
spring.kafka.producer.properties.retry.backoff.ms=1000

# Performance
spring.kafka.producer.batch-size=16384
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.buffer-memory=33554432

# Consumer (para M4)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.springqueue.domain.model
spring.kafka.consumer.group-id=transaction-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE

# =============================
# APP - TOPICS
# =============================
app.kafka.topics.transaction-events=transaction-events

# =============================
# LOGGING
# =============================
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n

# =============================
# ACTUATOR
# =============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# =============================
# RESILIENCE4J - CIRCUIT BREAKER
# =============================
resilience4j.circuitbreaker.instances.kafkaPublisher.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.kafkaPublisher.slidingWindowSize=10
resilience4j.circuitbreaker.instances.kafkaPublisher.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.kafkaPublisher.failureRateThreshold=50
resilience4j.circuitbreaker.instances.kafkaPublisher.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.kafkaPublisher.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.kafkaPublisher.automaticTransitionFromOpenToHalfOpenEnabled=true

# =============================
# DISTRIBUTED TRACING
# =============================
management.tracing.export.enabled=true
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

# =============================
# KAFKA - OBSERVATION (tracing headers)
# =============================
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

spring.kafka.consumer.properties.partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor